<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MiamMiam</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3f4144">

  <!-- Spécifique iOS pour le mode plein écran -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mes Repas">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>MiamMiam</h1>
  </header>

  <main>
    <!-- Vue Plats -->
    <section id="view-plats" class="view active">
      <ul id="liste-plats" class="liste"></ul>
    </section>

    <!-- Vue Aliments -->
    <section id="view-items" class="view">
      <ul id="liste-items" class="liste"></ul>
    </section>

    <!-- Vue Liste de course -->
    <section id="view-course" class="view">
      <h2>Liste de course</h2>
      <p>Votre liste de course apparaîtra ici.</p>
    </section>

    <!-- Vue Détail (plat ou aliment sélectionné) -->
    <section id="view-detail" class="view">
      <button id="btn-retour">&larr; Retour</button>
      <div class="detail-header">
        <h2 id="detail-titre"></h2>
        <button id="btn-modifier" type="button">Modifier</button>
      </div>
      <div id="detail-contenu"></div>
    </section>
  </main>

  <button id="btn-ajouter" class="add-floating-btn visible" type="button" aria-label="Ajouter un plat ou un aliment">+</button>

  <dialog id="dialog-ajout">
    <form id="form-ajout" class="dialog-form">
      <div class="dialog-header">
        <h2 id="dialog-ajout-titre">Ajouter un plat</h2>
        <button id="btn-fermer-dialog" class="dialog-close" type="button" aria-label="Fermer">&times;</button>
      </div>
      <input type="text" id="input-ajout-nom" placeholder="Nom du plat (ex: Poulet riz)" required>
      <select id="input-ajout-categorie">
        <option value="viande">Viande</option>
        <option value="feculent">Féculent</option>
        <option value="fruit">Fruit</option>
        <option value="legume">Légume</option>
      </select>
      <label class="photo-input">
        <span>Photo</span>
        <input type="file" id="input-ajout-photo" accept="image/*">
      </label>
      <button type="submit">Ajouter</button>
    </form>
  </dialog>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button data-view="plats" class="nav-btn active" type="button">
      <span class="tab-icon" aria-hidden="true"></span>
      <span>Plats</span>
    </button>
    <button data-view="items" class="nav-btn" type="button">
      <span class="tab-icon" aria-hidden="true"></span>
      <span>Aliments</span>
    </button>
    <button data-view="course" class="nav-btn" type="button">
      <span class="tab-icon" aria-hidden="true"></span>
      <span>Liste de course</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
